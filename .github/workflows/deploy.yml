name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Also reads secrets added under Settings → Environments → github-pages
    environment: github-pages
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify Supabase config
        run: |
          echo "VITE_SUPABASE_URL present: $([ -n \"$VITE_SUPABASE_URL\" ] && echo yes || echo no)"
          echo "VITE_SUPABASE_ANON_KEY present: $([ -n \"$VITE_SUPABASE_ANON_KEY\" ] && echo yes || echo no)"
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing VITE_SUPABASE_URL."
            echo "Add it under Settings → Secrets and variables → Actions → Repository secrets"
            echo "Name must be exactly: VITE_SUPABASE_URL (not under Variables unless you use vars)"
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing VITE_SUPABASE_ANON_KEY."
            echo "Add it under Settings → Secrets and variables → Actions → Repository secrets"
            echo "Name must be exactly: VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
